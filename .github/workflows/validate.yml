name: validate

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell scripts
        run: bash -n wsl/*.sh bin/cx-task repo/.codex/scripts/*.sh
      - name: Validate Python
        run: python3 -m py_compile codex/hooks/*.py repo/.codex/scripts/*.py scripts/*.py
      - name: Validate repository metadata
        run: python3 scripts/validate_repo.py

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $errors += $parseErrors }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
