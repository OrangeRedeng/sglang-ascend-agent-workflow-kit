model_provider = "zai_glm_china"
model = "glm-5.3"
model_reasoning_effort = "low"
model_reasoning_summary = "none"
model_catalog_json = "~/.codex/models.glm.json"

[model_providers.zai_glm_china]
name = "BigModel GLM Coding Plan"
base_url = "https://open.bigmodel.cn/api/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false

[model_providers.zai_glm_china.auth]
command = "__TOKEN_HELPER__"
args = ["glm"]
timeout_ms = 5000
refresh_interval_ms = 300000
